<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Path Pursuit</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230a0b0a'/%3E%3Cpath d='M32 28 L60 50 L32 72' stroke='%234ade80' stroke-width='11' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M50 28 L78 50 L50 72' stroke='%234ade80' stroke-width='11' fill='none' stroke-linecap='round' stroke-linejoin='round' opacity='0.45'/%3E%3C/svg%3E" />
  <style>
    :root {
      --bg: #0a0b0a; --surface: #111211; --border: #1e1f1e; --card: #131413;
      --card2: #161716; --accent: #4ade80; --adim: #0d1f15; --aborder: #1a3a2a;
      --text: #e8e9e8; --sub: #9ca3af; --muted: #6b7280; --tag: #1a1b1a;
      --blue: #60a5fa; --bdim: #0d1525; --bborder: #1a2a50;
      --yellow: #fbbf24; --ydim: #1a1200; --yborder: #3a2800;
      --red: #f87171; --rdim: #1a0808; --rborder: #3a1515;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; min-height: 100vh; font-size: 15px; }

    /* ── Header & Nav ── */
    .hdr { padding: 16px 28px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; background: var(--bg); z-index: 20; }
    .logo-row { display: flex; align-items: center; gap: 10px; }
    .logo-icon { flex-shrink: 0; border-radius: 7px; }
    .logo { font-size: 1.05rem; font-weight: 700; letter-spacing: -.02em; }
    .logo-arr { color: var(--accent); }
    .logo-sub { font-size: .72rem; color: var(--muted); margin-top: 1px; }
    .nav { display: flex; border-bottom: 1px solid var(--border); padding: 0 28px; }
    .ntab { padding: 11px 15px; font-size: 0.83rem; font-weight: 500; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; transition: color .15s; user-select: none; }
    .ntab:hover { color: var(--text); }
    .ntab.on { color: var(--accent); border-bottom-color: var(--accent); }
    .nbadge { background: var(--accent); color: #0a0b0a; font-size: .65rem; font-weight: 700; padding: 1px 5px; border-radius: 10px; margin-left: 4px; vertical-align: middle; }

    /* ── Buttons ── */
    .btn { display: inline-flex; align-items: center; gap: 5px; padding: 7px 14px; border-radius: 7px; font-size: .82rem; font-weight: 600; cursor: pointer; border: none; text-decoration: none; font-family: inherit; transition: opacity .15s; white-space: nowrap; }
    .btn:hover { opacity: .82; }
    .btn-p { background: var(--accent); color: #0a0b0a; }
    .btn-g { background: transparent; border: 1px solid var(--border); color: var(--text); }
    .btn-g:hover { border-color: #3a3b3a; }
    .btn-d { background: var(--adim); border: 1px solid var(--aborder); color: var(--accent); }
    .btn-sm { padding: 5px 10px; font-size: .76rem; }
    .btn-lg { padding: 11px 22px; font-size: .92rem; }
    .btn-full { width: 100%; justify-content: center; }
    .btn-r { background: var(--rdim); border: 1px solid var(--rborder); color: var(--red); }

    /* ── Inputs ── */
    input, textarea, select { background: var(--surface); border: 1px solid var(--border); color: var(--text); padding: 9px 13px; border-radius: 7px; font-size: .875rem; outline: none; font-family: inherit; transition: border-color .15s; width: 100%; }
    input:focus, textarea:focus, select:focus { border-color: var(--accent); }
    input::placeholder, textarea::placeholder { color: var(--muted); }
    textarea { resize: vertical; line-height: 1.5; }
    select { cursor: pointer; }
    select option { background: #1a1b1a; }
    .lbl { display: block; font-size: .75rem; font-weight: 600; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: .04em; }
    .fld { margin-bottom: 18px; }
    .hint { font-size: .73rem; color: var(--muted); margin-top: 5px; }

    /* ── Layout ── */
    .wrap { max-width: 820px; margin: 0 auto; padding: 26px 28px 60px; }

    /* ── Setup ── */
    .setup-outer { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 40px 20px; }
    .setup-box { width: 100%; max-width: 540px; }
    .setup-logo-row { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
    .setup-logo-icon { flex-shrink: 0; border-radius: 9px; }
    .setup-logo { font-size: 1.5rem; font-weight: 800; letter-spacing: -.03em; }
    .setup-sub { color: var(--muted); margin-bottom: 30px; font-size: .88rem; }
    .setup-step { font-size: .7rem; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 14px; margin-top: 24px; }
    .setup-row { display: flex; gap: 10px; align-items: center; margin-top: 6px; }

    /* ── Discover ── */
    .disc-head { margin-bottom: 24px; }
    .disc-head h2 { font-size: 1.3rem; font-weight: 700; letter-spacing: -.02em; margin-bottom: 5px; }
    .disc-head p { color: var(--sub); font-size: .88rem; }
    .disc-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 28px; }
    .dcard { background: var(--card); border: 1px solid var(--border); border-radius: 11px; padding: 20px; cursor: pointer; transition: border-color .15s, background .15s; }
    .dcard:hover { border-color: var(--aborder); background: var(--card2); }
    .dcard.off { opacity: .45; cursor: default; pointer-events: none; }
    .dcard-icon { font-size: 1.6rem; margin-bottom: 9px; }
    .dcard-title { font-size: .9rem; font-weight: 700; margin-bottom: 3px; }
    .dcard-desc { font-size: .77rem; color: var(--sub); line-height: 1.4; }
    .dcard-note { font-size: .7rem; color: var(--accent); margin-top: 7px; font-weight: 600; }
    .sec-lbl { font-size: .78rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 12px; }
    .sec-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 9px; }
    .stile { background: var(--card); border: 1px solid var(--border); border-radius: 9px; padding: 13px 10px; cursor: pointer; text-align: center; transition: border-color .15s, background .15s; }
    .stile:hover { border-color: var(--aborder); background: var(--card2); }
    .stile-icon { font-size: 1.3rem; margin-bottom: 5px; }
    .stile-name { font-size: .73rem; font-weight: 600; color: var(--sub); line-height: 1.3; }

    /* ── AI Loading / Results ── */
    .ai-load { text-align: center; padding: 40px 20px; }
    .ai-load-icon { font-size: 2.2rem; margin-bottom: 10px; }
    .ai-load-title { font-weight: 700; margin-bottom: 5px; }
    .ai-load-sub { color: var(--muted); font-size: .85rem; }
    .sug-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-bottom: 20px; }
    .sug-chip { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; cursor: pointer; transition: border-color .15s; }
    .sug-chip:hover { border-color: var(--aborder); }
    .sug-title { font-size: .87rem; font-weight: 600; margin-bottom: 3px; }
    .sug-reason { font-size: .74rem; color: var(--sub); }

    /* ── Quiz ── */
    .quiz-wrap { max-width: 520px; }
    .quiz-prog { font-size: .75rem; color: var(--muted); margin-bottom: 5px; }
    .quiz-q { font-size: 1.05rem; font-weight: 700; margin-bottom: 18px; }
    .quiz-opts { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
    .qopt { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 15px; cursor: pointer; transition: border-color .15s, background .15s; }
    .qopt:hover { border-color: var(--aborder); background: var(--card2); }
    .qopt-icon { font-size: 1.3rem; margin-bottom: 7px; }
    .qopt-lbl { font-size: .86rem; font-weight: 600; margin-bottom: 2px; }
    .qopt-desc { font-size: .73rem; color: var(--sub); }
    .res-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
    .res-chip { background: var(--adim); border: 1px solid var(--aborder); color: var(--accent); padding: 7px 14px; border-radius: 20px; font-size: .82rem; font-weight: 600; cursor: pointer; transition: opacity .15s; }
    .res-chip:hover { opacity: .8; }

    /* ── Search ── */
    .sbar { background: var(--surface); border-bottom: 1px solid var(--border); padding: 14px 28px; display: flex; gap: 9px; flex-wrap: wrap; align-items: center; }
    #skw { flex: 1; min-width: 180px; }
    .extbar { padding: 9px 28px; border-bottom: 1px solid var(--border); background: #0b0c0b; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .ext-lbl { font-size: .72rem; color: var(--muted); white-space: nowrap; }
    .elink { font-size: .76rem; color: var(--muted); text-decoration: none; border: 1px solid var(--border); padding: 3px 9px; border-radius: 5px; transition: all .15s; }
    .elink:hover { color: var(--text); border-color: #3a3b3a; }
    .rbar { padding: 11px 28px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .rcount { color: var(--muted); font-size: .8rem; }
    .jlist { padding: 14px 28px 40px; display: grid; gap: 9px; }
    .jcard { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 16px 18px; transition: border-color .15s; }
    .jcard:hover { border-color: #2a2b2a; }
    .jcard.is-saved { border-color: var(--aborder); }
    .jtitle { font-size: .95rem; font-weight: 600; margin-bottom: 5px; }
    .jmeta { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; margin-bottom: 9px; font-size: .78rem; color: var(--muted); }
    .jco { font-weight: 500; color: var(--sub); }
    .jdot { color: #3a3b3a; }
    .tag { background: var(--tag); border: 1px solid var(--border); border-radius: 3px; padding: 1px 6px; font-size: .71rem; color: var(--muted); }
    .tag-l { background: var(--adim); border-color: var(--aborder); color: var(--accent); }
    .jdesc { color: var(--sub); font-size: .79rem; line-height: 1.5; margin-bottom: 13px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .jact { display: flex; gap: 7px; flex-wrap: wrap; align-items: center; }
    .jdate { margin-left: auto; color: var(--muted); font-size: .73rem; }
    .pagn { padding: 18px 28px 40px; display: flex; gap: 5px; justify-content: center; flex-wrap: wrap; }

    /* ── Saved ── */
    .sv-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 15px 17px; margin-bottom: 9px; }
    .sv-top { display: flex; gap: 10px; align-items: flex-start; margin-bottom: 10px; }
    .sv-info { flex: 1; min-width: 0; }
    .sv-title { font-size: .92rem; font-weight: 600; margin-bottom: 2px; }
    .sv-co { font-size: .8rem; color: var(--sub); }
    .sv-act { display: flex; gap: 7px; flex-wrap: wrap; align-items: center; }
    .st-sel { background: var(--surface); border: 1px solid var(--border); color: var(--text); padding: 4px 8px; border-radius: 5px; font-size: .76rem; cursor: pointer; font-family: inherit; }
    .sbadge { font-size: .7rem; font-weight: 600; padding: 2px 7px; border-radius: 3px; border: 1px solid; }
    .sb-saved { background: var(--tag); border-color: var(--border); color: var(--muted); }
    .sb-applied { background: var(--bdim); border-color: var(--bborder); color: var(--blue); }
    .sb-interviewing { background: var(--ydim); border-color: var(--yborder); color: var(--yellow); }
    .sb-offered { background: var(--adim); border-color: var(--aborder); color: var(--accent); }
    .sb-rejected { background: var(--rdim); border-color: var(--rborder); color: var(--red); }

    /* ── Settings ── */
    .ss { margin-bottom: 28px; }
    .ss h3 { font-size: .9rem; font-weight: 700; margin-bottom: 12px; padding-bottom: 9px; border-bottom: 1px solid var(--border); }

    /* ── Generic states ── */
    .empty { text-align: center; padding: 50px 20px; color: var(--muted); font-size: .88rem; line-height: 1.6; }
    .empty strong { color: var(--text); display: block; margin-bottom: 5px; font-size: .98rem; }
    .back-row { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
    .back-row span { color: var(--muted); font-size: .82rem; }
    hr { border: none; border-top: 1px solid var(--border); margin: 20px 0; }

    /* ── Toast ── */
    .toast { position: fixed; bottom: 22px; right: 22px; background: var(--accent); color: #0a0b0a; padding: 10px 15px; border-radius: 8px; font-size: .83rem; font-weight: 600; opacity: 0; transform: translateY(5px); transition: all .2s; pointer-events: none; max-width: 280px; z-index: 999; }
    .toast.on { opacity: 1; transform: translateY(0); }

    @media (max-width: 620px) {
      .hdr, .nav, .sbar, .extbar, .rbar, .jlist, .pagn { padding-left: 14px; padding-right: 14px; }
      .wrap { padding: 18px 14px 50px; }
      .disc-grid, .quiz-opts, .sug-grid { grid-template-columns: 1fr; }
      .sec-grid { grid-template-columns: repeat(2, 1fr); }
      .jdate { display: none; }
    }
  </style>
</head>
<body>

<div id="app"></div>
<div class="toast" id="toast"></div>

<script>
/* ─── Config ─────────────────────────────────────────────── */
const INFLOW = 'https://activecatalyst.github.io/InFlow/';
const KEYS = { resume: 'inflow_resume_v2', apiKey: 'inflow_api_key', proxy: 'inflow_proxy_url', city: 'sdjobs_city_v1' };
const DEFAULT_CITY = 'San Diego, CA';

/* ─── SHARED JOB CONTRACT (ac_jobs_v1) ───────────────────────
   ONE shared job record under ONE key, read/written by BOTH apps in the suite
   (Path Pursuit + InFlow). The body below is IDENTICAL to InFlow/src/acJobs.js —
   keep them in sync.
     • id is deterministic from url, so the same posting never double-saves.
     • InFlow is the ONLY writer of `status` and `appliedAt`.
     • Path Pursuit writes discovery fields + status:"saved" on first save and
       never touches status again afterwards.
     • Both apps read the full array, mutate by id, write the full array back. */
const AC_JOBS_KEY       = "ac_jobs_v1";
const AC_MIGRATED_KEY   = "ac_migrated_v1";
const LEGACY_PP_KEY     = "sdjobs_saved_v1";
const LEGACY_INFLOW_KEY = "inflow_jobs_v2";

const AC_STATUSES = ["saved", "applied", "screen", "interview", "offer", "rejected"];
const AC_STATUS_RANK = { saved: 0, applied: 1, screen: 2, interview: 3, offer: 4, rejected: 5 };
const AC_STATUS_ALIAS = { interviewing: "interview", offered: "offer" };

function acMapStatus(s) {
  if (!s) return "saved";
  const m = AC_STATUS_ALIAS[s] || s;
  return AC_STATUSES.includes(m) ? m : "saved";
}

function acHash(str) {
  let h = 0x811c9dc5;
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = (h + ((h << 1) + (h << 4) + (h << 7) + (h << 8) + (h << 24))) >>> 0;
  }
  return h.toString(36);
}
function acRandId() { return "j_" + Math.random().toString(36).slice(2, 10) + Date.now().toString(36); }

function jobId(url) {
  const u = (url || "").trim();
  return u ? "u_" + acHash(u) : acRandId();
}

function acNow() { return new Date().toISOString(); }
function acToIso(v) {
  if (v == null || v === "") return null;
  if (typeof v === "number") return new Date(v).toISOString();
  return v;
}

function makeJob(f) {
  f = f || {};
  const url = (f.url || "").trim();
  return {
    id:        f.id || jobId(url),
    url,
    title:     f.title   || "",
    company:   f.company || "",
    jd:        f.jd      || "",
    source:    f.source  || "",
    status:    acMapStatus(f.status || "saved"),
    savedAt:   acToIso(f.savedAt) || acNow(),
    appliedAt: acToIso(f.appliedAt),
    analysis:  f.analysis != null ? f.analysis : null,
    tailored:  f.tailored != null ? f.tailored : null,
  };
}

function normalizeJob(o) {
  o = o || {};
  const url = (o.url || "").trim();
  const rec = Object.assign({}, o, {
    id:        url ? jobId(url) : (o.id || acRandId()),
    url,
    title:     o.title   || "",
    company:   o.company || "",
    jd:        o.jd != null ? o.jd : (o.jobDescription != null ? o.jobDescription : ""),
    source:    o.source  || "",
    status:    acMapStatus(o.status || "saved"),
    savedAt:   acToIso(o.savedAt) || acToIso(o.dateSaved) || acToIso(o.dateAdded) || acNow(),
    appliedAt: acToIso(o.appliedAt) || acToIso(o.dateApplied) || null,
    analysis:  o.analysis != null ? o.analysis : null,
    tailored:  o.tailored != null ? o.tailored : null,
  });
  delete rec.jobDescription;
  return rec;
}

function acRead() {
  try { const v = localStorage.getItem(AC_JOBS_KEY); const a = v ? JSON.parse(v) : []; return Array.isArray(a) ? a : []; }
  catch { return []; }
}
function acWrite(arr) {
  try { localStorage.setItem(AC_JOBS_KEY, JSON.stringify(arr)); return true; } catch { return false; }
}

function getJobs() { return acRead().map(normalizeJob); }
function findJob(id) { return getJobs().find(j => j.id === id) || null; }

function saveJob(record) {
  const rec = normalizeJob(record);
  const arr = acRead();
  const i = arr.findIndex(j => normalizeJob(j).id === rec.id);
  if (i === -1) {
    arr.unshift(rec);
  } else {
    const cur = normalizeJob(arr[i]);
    arr[i] = Object.assign({}, cur, {
      title:   cur.title   || rec.title,
      company: cur.company || rec.company,
      jd:      cur.jd      || rec.jd,
      source:  cur.source  || rec.source,
    });
  }
  acWrite(arr);
  return normalizeJob(arr[i === -1 ? 0 : i]);
}

function updateJob(id, patch) {
  const arr = acRead();
  const i = arr.findIndex(j => normalizeJob(j).id === id);
  if (i === -1) return null;
  arr[i] = normalizeJob(Object.assign({}, normalizeJob(arr[i]), patch));
  acWrite(arr);
  return arr[i];
}

function removeJob(id) {
  acWrite(acRead().filter(j => normalizeJob(j).id !== id));
}

function ppLegacyToJob(o) {
  o = o || {};
  return makeJob({
    url:     o.url || "",
    title:   o.title || "",
    company: o.company || "",
    jd:      o.desc != null ? o.desc : (o.jd || ""),
    source:  o.source || "path-pursuit",
    status:  o.status || "saved",
    savedAt: o.savedAt,
  });
}
function inflowLegacyToJob(o) {
  const rec = normalizeJob(o);
  if (!rec.source) rec.source = "inflow";
  return rec;
}
function acMergePrefer(a, b) {
  const hi = (AC_STATUS_RANK[b.status] || 0) > (AC_STATUS_RANK[a.status] || 0) ? b : a;
  const lo = hi === a ? b : a;
  return Object.assign({}, lo, hi, {
    title:    hi.title    || lo.title,
    company:  hi.company  || lo.company,
    jd:       hi.jd       || lo.jd,
    source:   hi.source   || lo.source,
    analysis: hi.analysis != null ? hi.analysis : lo.analysis,
    tailored: hi.tailored != null ? hi.tailored : lo.tailored,
  });
}

function migrateJobs() {
  try {
    if (localStorage.getItem(AC_MIGRATED_KEY) === "1") return;
    let ok = true;
    if (acRead().length === 0) {
      const map = new Map();
      const add = (rec) => { const cur = map.get(rec.id); map.set(rec.id, cur ? acMergePrefer(cur, rec) : rec); };
      let inf = [], pp = [];
      try { inf = JSON.parse(localStorage.getItem(LEGACY_INFLOW_KEY) || "[]"); } catch { inf = []; }
      try { pp  = JSON.parse(localStorage.getItem(LEGACY_PP_KEY)     || "[]"); } catch { pp  = []; }
      if (Array.isArray(inf)) inf.forEach(o => add(inflowLegacyToJob(o)));
      if (Array.isArray(pp))  pp.forEach(o => add(ppLegacyToJob(o)));
      if (map.size > 0) ok = acWrite(Array.from(map.values()));
    }
    if (ok) localStorage.setItem(AC_MIGRATED_KEY, "1");
  } catch { /* leave unmigrated; will retry next load */ }
}

/* Canonical status → Path Pursuit display (read-only; InFlow owns status). */
const AC_STATUS_LABEL = { saved:'Saved', applied:'Applied', screen:'Phone Screen', interview:'Interview', offer:'Offer', rejected:'Rejected' };
const AC_BADGE_CLASS  = { saved:'sb-saved', applied:'sb-applied', screen:'sb-interviewing', interview:'sb-interviewing', offer:'sb-offered', rejected:'sb-rejected' };

/* ─── State ──────────────────────────────────────────────── */
let S = {
  view: 'discover',        // setup | discover | search | saved | settings
  resume: '', apiKey: '', city: DEFAULT_CITY,
  savedJobs: [],
  discMode: null,          // null | ai-loading | ai-results | quiz
  aiSugs: [], quizStep: 0, quizAns: {},
  results: undefined,      // undefined=unsearched, null=error, []=searched
  relaxedMatch: false,     // true when exact-phrase search was empty and we fell back to word-level matching
  relaxWords: null,        // significant words used when relaxedMatch is on (reused by "Load more")
  remoteCount: 0,          // number of results sourced from Remotive (remote roles)
  loading: false,
  page: 1, totalPages: 1,
  // Keyword/category "Load more" paging: The Muse is sampled in blocks of
  // PAGES_PER_BLOCK pages; museBlock is the next block to fetch.
  kwMode: false,           // true for keyword/category searches (Load more), false for plain location browse
  museBlock: 0, musePageCount: 1, canLoadMore: false, loadingMore: false,
  seenIds: null,           // Set of job ids already shown (dedupes across blocks)
  lastQ: { kw: '', cat: '', level: '' },
};

/* ─── Storage ────────────────────────────────────────────── */
function loadStorage() {
  migrateJobs();                               // one-time legacy → ac_jobs_v1 (guarded)
  S.resume  = localStorage.getItem(KEYS.resume)  || '';

async function callClaude(sys, user) {
  if (!S.apiKey) throw new Error('No API key — add it in Settings');
  const proxy = localStorage.getItem(KEYS.proxy);
  const url = proxy || 'https://api.anthropic.com/v1/messages';
  const res = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type':'application/json', 'x-api-key':S.apiKey, 'anthropic-version':'2023-06-01', 'anthropic-dangerous-direct-browser-access':'true' },
    body: JSON.stringify({ model:'claude-haiku-4-5-20251001', max_tokens:900, system:sys, messages:[{role:'user',content:user}] })
  });
  if (!res.ok) { const e=await res.json().catch(()=>({})); throw new Error(e.error?.message||`API error ${res.status}`); }
  return (await res.json()).content[0].text;
}

/* ─── Job Search ─────────────────────────────────────────── */
async function fetchPage(params, pageIdx) {
  const p = new URLSearchParams({...params, page:pageIdx, descending:'true'});
  const r = await fetch(`https://www.themuse.com/api/public/jobs?${p}`);
  if (!r.ok) throw new Error('fetch failed');
  return r.json();
}

// Second source: Remotive (free, no key, CORS-enabled, remote roles open to
// any location). Only queried for keyword searches — normalized into the
// same shape as Muse job objects so renderCard() works unchanged.
async function fetchRemotive(kw) {
  if (!kw.trim()) return [];
  try {
    const p = new URLSearchParams({ search: kw.trim(), limit: '20' });
    const r = await fetch(`https://remotive.com/api/remote-jobs?${p}`);
    if (!r.ok) return [];
    const data = await r.json();
    return (data.jobs||[]).map(j => ({
      id: `remotive-${j.id}`,
      name: j.title,
      company: { name: j.company_name },
      locations: [{ name: j.candidate_required_location || 'Remote' }],
      categories: j.category ? [{ name: j.category }] : [],
      levels: [],
      contents: j.description||'',
      refs: { landing_page: j.url },
      publication_date: j.publication_date,
      _source: 'remote',
    }));
  } catch { return []; }
}

/* How many Muse pages we pull per "block" (initial load, and each "Load more"). */
const PAGES_PER_BLOCK = 10;
const SEARCH_STOP = new Set(['and','or','the','of','for','a','an','to','in','on','at','with','&']);

const byNewest = (a,b) => new Date(b.publication_date||0) - new Date(a.publication_date||0);
// Does a listing match a single lowercase term across title/company/description?
function jobMatches(j, s) { return j.name.toLowerCase().includes(s) || (j.company?.name||'').toLowerCase().includes(s) || strip(j.contents||'').toLowerCase().includes(s); }

// Fetch one block of Muse pages (block 0 = pages 0–9, block 1 = pages 10–19, …).
async function fetchMuseBlock(params, block) {
  const start = block * PAGES_PER_BLOCK;
  const idxs = Array.from({length: PAGES_PER_BLOCK}, (_,i) => start + i);
  const pages = await Promise.all(idxs.map(i => fetchPage(params,i).catch(()=>({results:[],page_count:1}))));
  return { results: pages.flatMap(p => p.results||[]), pageCount: pages[0].page_count || 1 };
}
// Drop listings already shown in this search (dedupe across blocks).
function dedupNew(list) { return list.filter(j => { if (S.seenIds.has(j.id)) return false; S.seenIds.add(j.id); return true; }); }
// Standard keyword/category filter used by both the first load and "Load more".
function filterMuse(list, kw, cat) {
  const kl = (kw||'').trim().toLowerCase();
  const catKws = cat ? (CATMAP[cat]||[cat.toLowerCase()]) : null;
  return list.filter(j => {
    const kwMatch = kl ? jobMatches(j, kl) : null;
    let catMatch = null;
    if (catKws) {
      const jc = (j.categories||[]).map(c=>c.name.toLowerCase());
      catMatch = catKws.some(k => jc.some(c=>c.includes(k)));
    }
    // When both keyword and category are set, match either (AND was too
    // restrictive against the sampled page set and often produced zero results).
    if (kwMatch !== null && catMatch !== null) return kwMatch || catMatch;
    if (kwMatch !== null) return kwMatch;
    if (catMatch !== null) return catMatch;
    return true;
  });
}

async function doSearch(kw='', cat='', level='', page=1) {
  S.loading = true; S.page = page; S.lastQ = {kw,cat,level};
  if (S.view !== 'search') S.view = 'search';
  // Reset paging/dedupe state for a fresh search.
  S.relaxedMatch = false; S.relaxWords = null; S.remoteCount = 0;
  S.seenIds = new Set(); S.museBlock = 0; S.musePageCount = 1; S.canLoadMore = false; S.loadingMore = false;
  render();

  const params = { location: S.city || DEFAULT_CITY };
  if (level) params.level = level;
  // Note: `category` is intentionally NOT sent to the API — passing it
  // causes The Muse API to return zero results entirely. Category
  // filtering happens client-side via CATMAP below.

  try {
    let results, totalPages;
    if (kw.trim() || cat) {
      S.kwMode = true;
      // First block of Muse pages + a second source (Remotive) in parallel.
      const [block, remoteJobs] = await Promise.all([
        fetchMuseBlock(params, 0),
        fetchRemotive(kw),
      ]);
      S.musePageCount = block.pageCount;
      const kl = kw.trim().toLowerCase();
      const catKws = cat ? (CATMAP[cat]||[cat.toLowerCase()]) : null;
      const uniq = dedupNew(block.results);
      results = filterMuse(uniq, kw, cat);

      // Fallback: a multi-word phrase (e.g. "Operations Coordinator") often
      // doesn't appear verbatim even though related roles exist. If the
      // exact-phrase search came back empty, retry on the significant words —
      // first against titles, then titles/company/description. The words are
      // kept so "Load more" stays consistent with this relaxed matching.
      if (results.length === 0 && kl && kl.includes(' ')) {
        const words = kl.split(/\s+/).filter(w => w.length > 2 && !SEARCH_STOP.has(w));
        if (words.length) {
          results = uniq.filter(j => words.some(w => j.name.toLowerCase().includes(w)));
          if (results.length === 0) results = uniq.filter(j => words.some(w => jobMatches(j, w)));
          if (results.length > 0) { S.relaxedMatch = true; S.relaxWords = words; }
        }
      }

      // Merge in Remotive results (optionally narrowed by the same category
      // mapping used for Muse jobs). Remotive is a fixed one-shot fetch, so it
      // only contributes on the first load, not on "Load more".
      let remote = remoteJobs;
      if (catKws) {
        remote = remote.filter(j => {
          const jc = (j.categories||[]).map(c=>c.name.toLowerCase());
          return catKws.some(k => jc.some(c=>c.includes(k)));
        });
      }
      remote.forEach(j => S.seenIds.add(j.id));
      S.remoteCount = remote.length;
      results = [...results, ...remote].sort(byNewest);
      // More blocks available if The Muse reports more pages than we've pulled.
      S.museBlock = 1;
      S.canLoadMore = S.museBlock * PAGES_PER_BLOCK < S.musePageCount;
      S.totalPages = 1;
    } else {
      // Plain location browse — one API page per view, numbered pagination.
      S.kwMode = false; S.canLoadMore = false;
      const data = await fetchPage(params, page-1);
      results = (data.results||[]).slice().sort(byNewest);
      S.totalPages = data.page_count||1;
    }
    S.results = results;
  } catch {
    S.results = null;
  }
  S.loading = false;
  render();
}

// Fetch and append the next block of Muse pages for a keyword/category search.
async function loadMore() {
  if (!S.canLoadMore || S.loadingMore) return;
  S.loadingMore = true;
  const btn = document.getElementById('loadMore');
  if (btn) { btn.disabled = true; btn.textContent = 'Loading…'; }
  const {kw, cat, level} = S.lastQ;
  const params = { location: S.city || DEFAULT_CITY };
  if (level) params.level = level;
  try {
    const block = await fetchMuseBlock(params, S.museBlock);
    if (block.pageCount) S.musePageCount = block.pageCount;
    const uniq = dedupNew(block.results);
    let more;
    if (S.relaxedMatch && S.relaxWords && S.relaxWords.length) {
      more = uniq.filter(j => S.relaxWords.some(w => j.name.toLowerCase().includes(w) || jobMatches(j, w)));
    } else {
      more = filterMuse(uniq, kw, cat);
    }
    more.sort(byNewest);
    S.results = [...(S.results||[]), ...more];
    S.museBlock += 1;
    S.canLoadMore = S.museBlock * PAGES_PER_BLOCK < S.musePageCount;
  } catch {
    // Keep what's shown; leave the button so the user can retry.
  }
  S.loadingMore = false;
  const y = window.scrollY;
  render();
  window.scrollTo(0, y);
}

        </div>
      </div>

      <div class="sec-lbl">Browse ${esc(cityName())} Industries</div>
      <div class="sec-grid">
        ${SECTORS.map((s,i)=>`
          <div class="stile" data-sector="${i}">
            <div class="stile-icon">${s.icon}</div>
            <div class="stile-name">${esc(s.name)}</div>
          </div>`).join('')}
      </div>
    </div>`;
}

function renderQuiz() {
  const step = S.quizStep;
  if (step >= QS.length) {
    const w = S.quizAns[0]?.k, ind = S.quizAns[1]?.k, exp = S.quizAns[2];
    const jobs = QMAP[`${w}+${ind}`] || ['Project Manager','Operations Coordinator','Business Analyst','Marketing Coordinator'];
    return `
      <div class="wrap">
        <div class="back-row">
          <button class="btn btn-g btn-sm" data-back="discover">← Back</button>
          <span>Based on your answers — click any to search</span>
        </div>
        <div class="quiz-wrap">
          <div class="res-chips">
            ${jobs.map(j=>`<div class="res-chip" data-srch="${esc(j)}" data-level="${esc(exp?.level||'')}">${esc(j)}</div>`).join('')}
          </div>
          <button class="btn btn-g btn-sm" id="retake">Retake quiz</button>
        </div>
      </div>`;
  }
  const q = QS[step];
  return `
    <div class="wrap">
      <div class="quiz-wrap">
        <div class="quiz-prog">Question ${step+1} of ${QS.length}</div>
        <div class="quiz-q">${esc(q.q)}</div>
        <div class="quiz-opts">
          ${q.opts.map((o,i)=>`
            <div class="qopt" data-qi="${i}">
              <div class="qopt-icon">${o.icon}</div>
              <div class="qopt-lbl">${esc(o.lbl)}</div>
              <div class="qopt-desc">${esc(o.desc)}</div>
            </div>`).join('')}
        </div>
        ${step>0?`<div style="margin-top:14px"><button class="btn btn-g btn-sm" id="qback">← Back</button></div>`:''}
      </div>
    </div>`;
}

/* ── Search ── */
function renderSearch() {
  const {kw,cat,level} = S.lastQ;
  let body;
  if (S.loading) {
    body = `<div class="empty">Searching ${esc(cityName())} jobs…</div>`;
  } else if (S.results === null) {
    body = '<div class="empty"><strong>Connection error</strong>Check your internet and try again.</div>';
  } else if (!Array.isArray(S.results)) {
    body = `<div class="empty"><strong>Search ${esc(cityName())} jobs</strong>Enter keywords above, or <button class="btn btn-g btn-sm" data-nav="discover">use Discovery →</button></div>`;
  } else if (S.results.length === 0) {
    body = '<div class="empty"><strong>No jobs found</strong>Try different keywords, or check the external boards above.</div>';
  } else {
    const pageInfo = !kw && S.totalPages>1 ? `· Page ${S.page} of ${S.totalPages}` : '';
    body = `
      <div class="rbar">
        <div class="rcount">${S.results.length} job${S.results.length!==1?'s':''} in ${esc(cityName())}${kw?` for "${esc(kw)}"`:''}  ${pageInfo} · newest first${S.remoteCount?` (incl. ${S.remoteCount} remote)`:''}</div>
        ${S.relaxedMatch ? `<div class="hint">No exact matches for "${esc(kw)}" — showing closely related roles instead.</div>` : ''}
      </div>
      <div class="jlist">${S.results.map(j=>renderCard(j)).join('')}</div>
      ${S.kwMode && S.canLoadMore ? `<div class="pagn"><button class="btn btn-g btn-lg" id="loadMore">Load more results</button></div>` : ''}
      ${S.kwMode && !S.canLoadMore && S.results.length ? `<div class="empty" style="padding:24px">That's every match we could find${kw?` for "${esc(kw)}"`:''}. Try the external boards above for more.</div>` : ''}
      ${!kw && S.totalPages>1 ? renderPagn(S.totalPages,S.page) : ''}`;
  }

  return `
    <div class="sbar">
      <input type="text" id="skw" value="${esc(kw)}" placeholder="Job title, skills, company…" />
      <select id="scat">
        <option value="">All Categories</option>
        ${CATS.map(c=>`<option value="${esc(c)}" ${cat===c?'selected':''}>${esc(c)}</option>`).join('')}
      </select>
      <select id="slvl">
        <option value="">All Levels</option>
        ${LEVELS.map(l=>`<option value="${esc(l)}" ${level===l?'selected':''}>${esc(l)}</option>`).join('')}
      </select>
      <button class="btn btn-p" id="doSearch">Search</button>
    </div>
    <div class="extbar">
      <span class="ext-lbl">Also search on:</span>
      ${extLinks(kw)}
    </div>
    ${body}`;
}

function renderCard(j) {
  const title   = j.name||'Untitled';
  const company = j.company?.name||'';
  const locs    = (j.locations||[]).map(l=>l.name).join(', ')||(S.city||DEFAULT_CITY);
  const cats    = (j.categories||[]).map(c=>c.name);
  const levels  = (j.levels||[]).map(l=>l.name);
  const desc    = strip(j.contents||'').trim();
  const url     = j.refs?.landing_page||'#';
  const date    = ago(j.publication_date);
  const saved   = isSaved(url);
  return `
    <div class="jcard ${saved?'is-saved':''}">
      <div class="jtitle">${esc(title)}</div>
      <div class="jmeta">
        ${company?`<span class="jco">${esc(company)}</span><span class="jdot">·</span>`:''}
        <span>📍 ${esc(locs)}</span>
        ${j._source==='remote'?`<span class="tag tag-l">🌐 Remote</span>`:''}
        ${levels.map(l=>`<span class="tag tag-l">${esc(l)}</span>`).join('')}
        ${cats.map(c=>`<span class="tag">${esc(c)}</span>`).join('')}
      </div>
      ${desc?`<div class="jdesc">${esc(desc)}</div>`:''}
      <div class="jact">
        <a href="${esc(url)}" target="_blank" class="btn btn-g btn-sm">View ↗</a>
        <button class="btn btn-g btn-sm" data-copy-url="${esc(url)}">📋 Copy URL</button>
        ${desc?`<button class="btn btn-g btn-sm" data-copy-desc="${esc(desc.slice(0,3000))}">Copy Description</button>`:''}
        <button class="btn btn-p btn-sm" data-analyze="${esc(url)}">Analyze in InFlow</button>
        ${saved
          ?`<span class="tag tag-l">Saved ✓ · In InFlow</span>
            <a href="${esc(inflowLink(jobId(url)))}" target="_blank" class="btn btn-g btn-sm">Open in InFlow ↗</a>`
          :`<button class="btn btn-g btn-sm" data-save='${esc(JSON.stringify({title,company,url,desc:desc.slice(0,500),source:j._source==='remote'?'remotive':'the-muse'}))}'>Save</button>`}
        ${date?`<span class="jdate">${date}</span>`:''}
      </div>
    </div>`;
}

function renderPagn(total, cur) {
  const btns=[];
  if(cur>1) btns.push(`<button class="btn btn-g btn-sm" data-page="${cur-1}">← Prev</button>`);
  const lo=Math.max(1,cur-2), hi=Math.min(total,cur+2);
  for(let i=lo;i<=hi;i++) btns.push(`<button class="btn ${i===cur?'btn-p':'btn-g'} btn-sm" data-page="${i}">${i}</button>`);
  if(cur<total) btns.push(`<button class="btn btn-g btn-sm" data-page="${cur+1}">Next →</button>`);
  return `<div class="pagn">${btns.join('')}</div>`;
}

/* ── Saved ──
   Status is read-only here — it's set in InFlow and reflected back through the
   shared ac_jobs_v1 store. Path Pursuit shows it and links across to InFlow. */
function statusBadge(s) {
  const k = acMapStatus(s);
  return `<span class="sbadge ${AC_BADGE_CLASS[k]||'sb-saved'}">${AC_STATUS_LABEL[k]||'Saved'}</span>`;
}

function renderSaved() {
  if (!S.savedJobs.length) return `
    <div class="wrap">
      <div class="empty"><strong>No saved jobs yet</strong>Use the Save button on any job card in Search.</div>
    </div>`;
  return `
    <div class="wrap">
      ${S.savedJobs.map(j=>`
        <div class="sv-card">
          <div class="sv-top">
            <div class="sv-info">
              <div class="sv-title">${esc(j.title||'Untitled')}</div>
              <div class="sv-co">${esc(j.company)}${j.company?' · ':''}${statusBadge(j.status)} <span class="tag tag-l">In InFlow</span></div>
            </div>
          </div>
          <div class="sv-act">
            ${j.url?`<a href="${esc(j.url)}" target="_blank" class="btn btn-g btn-sm">View ↗</a>
            <button class="btn btn-g btn-sm" data-copy-url="${esc(j.url)}">📋 Copy URL</button>`:''}
            <a href="${esc(inflowLink(j.id))}" target="_blank" class="btn btn-p btn-sm">Open in InFlow ↗</a>
            <button class="btn btn-r btn-sm" data-remove-id="${esc(j.id)}">Remove</button>
          </div>
        </div>`).join('')}
    </div>`;
}

/* ── Settings ── */
function renderSettings() {
  return `
    <div class="wrap">
      <div class="ss">
        <h3>Location</h3>
        <div class="fld">
          <label class="lbl">City &amp; state</label>
          <input type="text" id="setCity" value="${esc(S.city)}" placeholder="e.g. Austin, TX" />
          <div class="hint">Used for job search, AI matching, and external job board links. Format: "City, ST".</div>
        </div>
        <button class="btn btn-p" id="saveCity">Save Location</button>
      </div>
      <hr/>
      <div class="ss">
        <h3>Resume</h3>
        <div class="fld">
          <label class="lbl">Your resume</label>
          <textarea id="setRes" rows="12" placeholder="Paste your full resume…">${esc(S.resume)}</textarea>
          <div class="hint" id="setResLen">${S.resume.length} chars${S.resume.length>=50?' ✓':''}</div>
        </div>
        <button class="btn btn-p" id="saveRes">Save Resume</button>
      </div>
      <hr/>
      <div class="ss">
        <h3>API Key</h3>
        <div class="fld">
          <label class="lbl">Anthropic API key</label>
          <input type="password" id="setKey" value="${esc(S.apiKey)}" placeholder="sk-ant-… same key as InFlow" />
          <div class="hint">Powers AI job matching in Discovery. Stored locally only.</div>
        </div>
        <div style="display:flex;gap:8px">
          <button class="btn btn-p" id="saveKey">Save Key</button>
          ${S.apiKey?`<button class="btn btn-r btn-sm" id="clearKey">Clear</button>`:''}
        </div>
      </div>
      <hr/>
      <div class="ss">
        <h3>Data</h3>
        <p style="color:var(--muted);font-size:.82rem;margin-bottom:14px">Saved jobs: ${S.savedJobs.length}. All data is stored in your browser only.</p>
        <button class="btn btn-r btn-sm" id="clearSaved">Clear saved jobs</button>
      </div>
    </div>`;
}

/* ─── Event wiring ───────────────────────────────────────── */
function wire() {
  const on = (id, ev, fn) => { const el=document.getElementById(id); if(el) el.addEventListener(ev,fn); };
  const $ = sel => document.querySelectorAll(sel);

  /* Nav tabs */
  $('[data-nav]').forEach(el => el.addEventListener('click', () => { S.view=el.dataset.nav; S.discMode=null; render(); }));
  $('[data-back]').forEach(el => el.addEventListener('click', () => { S.discMode=null; S.view=el.dataset.back; render(); }));

  /* Setup */
  on('setupRes','input', e => { S.resume=e.target.value; document.getElementById('resLen').textContent=`${S.resume.length} chars${S.resume.length<50?' — paste your resume above':' ✓'}`; });
  on('setupGo','click', () => {
    S.resume = document.getElementById('setupRes').value.trim();
    S.apiKey = document.getElementById('setupKey').value.trim();
    if (S.resume.length < 50) { toast('Paste more of your resume first.'); return; }
    localStorage.setItem(KEYS.resume, S.resume);
    if (S.apiKey) localStorage.setItem(KEYS.apiKey, S.apiKey);
    S.view = 'discover'; render();
  });
  on('setupSkip','click', () => {
    S.resume = document.getElementById('setupRes').value.trim();
    S.apiKey = document.getElementById('setupKey').value.trim();
    if (S.resume) localStorage.setItem(KEYS.resume, S.resume);
    if (S.apiKey) localStorage.setItem(KEYS.apiKey, S.apiKey);
    S.view = 'discover'; render();
  });

  /* Discover */
  on('discAI','click', runAI);
  on('discQuiz','click', () => { S.discMode='quiz'; S.quizStep=0; S.quizAns={}; render(); });
  $('[data-sector]').forEach(el => el.addEventListener('click', () => {
    const s = SECTORS[+el.dataset.sector];
    doSearch(s.kw, s.cat, '');
  }));
  $('[data-srch]').forEach(el => el.addEventListener('click', () => {
    doSearch(el.dataset.srch, '', el.dataset.level||'');
  }));

  /* Quiz */
  $('[data-qi]').forEach(el => el.addEventListener('click', () => {
    S.quizAns[S.quizStep] = QS[S.quizStep].opts[+el.dataset.qi];
    S.quizStep++;
    render();
  }));
  on('qback','click', () => { S.quizStep = Math.max(0, S.quizStep-1); render(); });
  on('retake','click', () => { S.quizStep=0; S.quizAns={}; render(); });

  /* Search */
  on('doSearch','click', () => doSearch(
    document.getElementById('skw')?.value.trim()||'',
    document.getElementById('scat')?.value||'',
    document.getElementById('slvl')?.value||''
  ));
  on('skw','keydown', e => { if(e.key==='Enter') document.getElementById('doSearch')?.click(); });
  on('loadMore','click', loadMore);

  /* Pagination */
  $('[data-page]').forEach(el => el.addEventListener('click', () => {
    doSearch(S.lastQ.kw, S.lastQ.cat, S.lastQ.level, +el.dataset.page);
  }));

  /* Job actions */
  $('[data-copy-url]').forEach(el => el.addEventListener('click', () => copyText(el.dataset.copyUrl, 'URL copied! Paste into InFlow.')));
  $('[data-copy-desc]').forEach(el => el.addEventListener('click', () => copyText(el.dataset.copyDesc, 'Description copied! Paste into InFlow.')));
  $('[data-analyze]').forEach(el => el.addEventListener('click', () => analyzeInFlow(el.dataset.analyze)));
  $('[data-save]').forEach(el => el.addEventListener('click', () => {
    try { saveFromCard(JSON.parse(el.dataset.save)); } catch {}
  }));

  /* Saved (status is read-only — set in InFlow) */
  $('[data-remove-id]').forEach(el => el.addEventListener('click', () => removeFromShared(el.dataset.removeId)));

  /* Settings */
  on('setCity','input', e => S.city=e.target.value);
  on('saveCity','click', () => {
    const v = (document.getElementById('setCity')?.value||'').trim();
    S.city = v || DEFAULT_CITY;
    localStorage.setItem(KEYS.city, S.city);
    toast('Location saved!');
    render();
  });
  on('setRes','input', e => { S.resume=e.target.value; const l=document.getElementById('setResLen'); if(l)l.textContent=`${S.resume.length} chars${S.resume.length>=50?' ✓':''}`; });
  on('saveRes','click', () => { S.resume=(document.getElementById('setRes')?.value||'').trim(); localStorage.setItem(KEYS.resume,S.resume); toast('Resume saved!'); render(); });
  on('setKey','input', e => S.apiKey=e.target.value);
  on('saveKey','click', () => { S.apiKey=(document.getElementById('setKey')?.value||'').trim(); localStorage.setItem(KEYS.apiKey,S.apiKey); toast('API key saved!'); render(); });
  on('clearKey','click', () => { S.apiKey=''; localStorage.removeItem(KEYS.apiKey); toast('Key cleared'); render(); });
  on('clearSaved','click', () => { if(!confirm('Clear all saved jobs? This clears the shared job store used by InFlow too.')) return; localStorage.setItem(AC_JOBS_KEY, '[]'); refreshSaved(); toast('Cleared'); render(); });
}

/* ─── Init ───────────────────────────────────────────────── */
loadStorage();
render();
</script>
</body>
</html>
